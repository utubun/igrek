name: Run Analysis (Manual)

on:
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      WT_R1_URL: ${{ secrets.IGREK_WT_R1_URL }}
      WT_R2_URL: ${{ secrets.IGREK_WT_R2_URL }}
      MT_R1_URL: ${{ secrets.IGREK_MT_R1_URL }}
      MT_R2_URL: ${{ secrets.IGREK_MT_R2_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Ensure raw input directory
        run: mkdir -p data/raw

      - name: Install gdown
        run: pip install --quiet gdown

      - name: Download raw FASTQ files when missing
        shell: bash
        run: |
          set -euo pipefail

          extract_drive_id() {
            local url="$1"
            if [[ "$url" =~ drive\.google\.com/file/d/([^/]+) ]]; then
              echo "${BASH_REMATCH[1]}"
              return
            fi
            if [[ "$url" =~ [\?\&]id=([^\&]+) ]]; then
              echo "${BASH_REMATCH[1]}"
              return
            fi
            echo ""
          }

          download_if_missing() {
            local url="$1"
            local out="$2"
            if [[ -f "$out" ]]; then
              echo "Already present: $out"
              return
            fi
            if [[ -z "$url" ]]; then
              echo "Missing URL secret for $out"
              exit 1
            fi
            echo "Downloading $out"
            if [[ "$url" == *"drive.google.com"* ]]; then
              local file_id
              file_id="$(extract_drive_id "$url")"
              if [[ -z "$file_id" ]]; then
                echo "ERROR: Could not extract Google Drive file id from URL for $out"
                exit 1
              fi
              gdown "$file_id" -O "$out"
            else
              gdown "$url" -O "$out"
            fi
          }

          validate_fastq() {
            local f="$1"
            if ! gzip -t "$f" 2>/dev/null; then
              echo "ERROR: $f is not a valid gzip file."
              echo "File head:"
              head -c 200 "$f"
              exit 1
            fi
            echo "OK: $f ($(du -sh "$f" | cut -f1))"
          }

          download_if_missing "$WT_R1_URL" "data/raw/SH612x19_251023_LH00255_A235FKJLT3_R1.fastq.gz"
          download_if_missing "$WT_R2_URL" "data/raw/SH612x19_251023_LH00255_A235FKJLT3_R2.fastq.gz"
          download_if_missing "$MT_R1_URL" "data/raw/SH612x20_251023_LH00255_A235FKJLT3_R1.fastq.gz"
          download_if_missing "$MT_R2_URL" "data/raw/SH612x20_251023_LH00255_A235FKJLT3_R2.fastq.gz"

          echo "Validating downloaded files..."
          validate_fastq "data/raw/SH612x19_251023_LH00255_A235FKJLT3_R1.fastq.gz"
          validate_fastq "data/raw/SH612x19_251023_LH00255_A235FKJLT3_R2.fastq.gz"
          validate_fastq "data/raw/SH612x20_251023_LH00255_A235FKJLT3_R1.fastq.gz"
          validate_fastq "data/raw/SH612x20_251023_LH00255_A235FKJLT3_R2.fastq.gz"

      - name: Build analysis image
        run: docker build -t igrek:latest .

      - name: Run containerized preprocessing/calling
        run: docker compose up --abort-on-container-exit

      - name: Run containerized R postprocessing
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            igrek:latest \
            Rscript src/main.R

      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: igrek-analysis-${{ github.run_id }}
          path: |
            data/cln/variants/joint.vcf
            data/cln/variants/counts.tsv
            data/cln/variants/qc_all.csv
            data/cln/variants/qc_filt.csv
            data/cln/variants/final_candidates.csv
            README.md
